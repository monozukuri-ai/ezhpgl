name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install 'packaging>=24,<27' 'pytest>=8,<10'
      - run: python scripts/check_public_docs.py
      - run: python scripts/check_release.py
      - run: python -m pytest tests/release
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 check --workspace --locked

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.11,<2" "pytest>=8,<10"
      - run: maturin build --release --locked --out dist
      - run: python scripts/check_dist.py
      - name: Install the wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])"
      - run: python -m pytest
      - run: ezhpgl --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.11,<2" "pytest>=8,<10"
      - run: maturin sdist --out dist
      - run: python scripts/check_dist.py
      - name: Build and install from sdist
        run: python -m pip install --no-deps dist/*.tar.gz
      - run: python -m pytest
      - run: ezhpgl --version
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
