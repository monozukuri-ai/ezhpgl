name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install 'packaging>=24,<27' 'pytest>=8,<10'
      - name: Check version and tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          args=()
          if [ "$REF_TYPE" = tag ]; then
            args+=(--tag "$REF_NAME")
          fi
          python scripts/check_release.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - run: python scripts/check_public_docs.py
      - run: python -m pytest tests/release
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check minimum Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --locked

  wheels:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            interpreter: python3.12
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            interpreter: python
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
            interpreter: python
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
            interpreter: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.11.5
          args: --release --locked --out dist --compatibility pypi -i ${{ matrix.interpreter }}
      - run: python -m pip install 'packaging>=24,<27'
      - run: python scripts/check_release.py --dist dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Install and test on Python 3.10
        run: |
          python -m pip install 'pytest>=8,<10'
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])"
          python -m pytest
          ezhpgl --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install and test on Python 3.14
        run: |
          python -m pip install 'pytest>=8,<10'
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])"
          python -m pytest
          ezhpgl --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: python -m pip install 'maturin==1.11.5' 'packaging>=24,<27' 'pytest>=8,<10'
      - run: maturin sdist --out dist
      - run: python scripts/check_release.py --dist dist
      - name: Build and test from source distribution
        run: |
          python -m pip install --no-deps dist/*.tar.gz
          python -m pytest
          ezhpgl --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  distributions:
    needs: [quality, wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: wheel-*
          path: release/packages
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sdist
          path: release/packages
      - run: python -m pip install 'packaging>=24,<27' 'twine>=6.1,<7'
      - name: Verify complete release set
        env:
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --dist release/packages --complete --checksums release/SHA256SUMS
      - run: python -m twine check --strict release/packages/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: distributions
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ezhpgl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/packages/

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, distributions, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
          PRERELEASE: ${{ needs.quality.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/packages/* release/SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${args[@]}"
