name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build (blank uses the selected ref)'
        type: string
        default: ''
      publish:
        description: 'Publish the validated tag to PyPI and GitHub Release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          path: source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install 'packaging>=24,<27' 'pytest>=8,<10'
      - name: Check version and tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          args=()
          if [ -n "$REQUESTED_TAG" ]; then
            args+=(--tag "$REQUESTED_TAG")
          elif [ "$REF_TYPE" = tag ]; then
            args+=(--tag "$REF_NAME")
          fi
          publish=false
          if [ "$EVENT_NAME" = push ] || [ "$REQUESTED_PUBLISH" = true ]; then
            if [ "${#args[@]}" -eq 0 ]; then
              echo 'Publishing requires an existing version tag.' >&2
              exit 1
            fi
            publish=true
          fi
          python scripts/check_release.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - run: python scripts/check_public_docs.py
      # Tooling tests follow the workflow revision; product checks use the exact tag.
      - run: python -m pytest ../release-tools/tests/release
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check minimum Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --locked

  wheels:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            interpreter: python3.12
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            interpreter: python3.12
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            interpreter: python
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
            interpreter: python
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
            interpreter: python
    runs-on: ${{ matrix.os }}
    steps:
      # Existing release tags may predate the plot-file .gitattributes rules.
      - name: Preserve source bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.quality.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.11.5
          args: --release --locked --out dist --compatibility pypi -i ${{ matrix.interpreter }}
      - run: python -m pip install 'packaging>=24,<27'
      - run: python scripts/check_release.py --dist dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Install and test on Python 3.10
        run: |
          python -m pip install 'pytest>=8,<10'
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])"
          python -m pytest
          ezhpgl --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install and test on Python 3.14
        run: |
          python -m pip install 'pytest>=8,<10'
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])"
          python -m pytest
          ezhpgl --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.quality.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: python -m pip install 'maturin==1.11.5' 'packaging>=24,<27' 'pytest>=8,<10'
      - run: maturin sdist --out dist
      - run: python scripts/check_release.py --dist dist
      - name: Build and test from source distribution
        run: |
          python -m pip install --no-deps dist/*.tar.gz
          python -m pytest
          ezhpgl --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  distributions:
    needs: [quality, wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.quality.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: wheel-*
          path: release/packages
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sdist
          path: release/packages
      - run: python -m pip install 'packaging>=24,<27' 'twine>=6.1,<7'
      - name: Verify complete release set
        env:
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --dist release/packages --complete --checksums release/SHA256SUMS
      - run: python -m twine check --strict release/packages/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error

  pypi:
    if: needs.quality.outputs.publish == 'true'
    needs: [quality, distributions]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ezhpgl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/packages/

  github-release:
    if: needs.quality.outputs.publish == 'true'
    needs: [quality, distributions, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
          PRERELEASE: ${{ needs.quality.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/packages/* release/SHA256SUMS
            gh release edit "$RELEASE_TAG" --prerelease="$PRERELEASE"
          else
            gh release create "$RELEASE_TAG" release/packages/* release/SHA256SUMS \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${args[@]}"
          fi
